<div class="row" [class.me]="isMe" [class.offline]="!online">
    <span class="avatar" [style.background]="player.color" [class.dashed]="player.role === 'spectator'">
        {{ player.name.charAt(0) | uppercase }}
        <span class="dot" [class.on]="online" [attr.aria-label]="online ? 'Online' : 'Offline'"></span>
    </span>

    <div class="info">
        <div class="name">{{ isMe ? 'You' : player.name }}</div>
        <div class="sub">
            @if (player.role === 'player') {
            {{ online ? 'Player' : 'Offline' }}
            } @else {
            <span [class]="'tag tag-' + player.role">{{ roleLabel() }}</span>
            @if (!online) { <span class="off">· offline</span> }
            }
        </div>
    </div>

    @if (canManage && !isMe) {
    <app-player-menu [player]="player" [canKick]="true"
        [canChangeHelpers]="canChangeHelpers && player.role !== 'spectator'"
        [canHandOver]="canHandOver && player.role !== 'spectator'"
        (kick)="kick.emit($event)" (toggleHelper)="toggleHelper.emit($event)" (handOver)="handOver.emit($event)" />
    }
</div>
