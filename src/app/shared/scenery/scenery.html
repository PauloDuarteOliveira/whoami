<svg [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="xMidYMid slice" focusable="false">
  <defs>
    <linearGradient id="shoot-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8EC" stop-opacity="0.95" />
      <stop offset="1" stop-color="#FFF8EC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g class="stars">
    @for (s of stars; track $index) {
      <circle class="twinkle" [attr.cx]="s.x" [attr.cy]="s.y" [attr.r]="s.r"
        [style.animation-duration]="s.duration" [style.animation-delay]="s.delay" />
    }
  </g>

  <g class="shoot">
    <path d="M0 0 L150 -62" stroke="url(#shoot-trail)" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.6" />
  </g>

  <g class="moon">
    <circle cx="1180" cy="170" r="110" opacity="0.10" />
    <circle cx="1180" cy="170" r="62" opacity="0.16" />
    <circle cx="1180" cy="170" r="40" opacity="0.55" />
  </g>

  <g class="sun">
    <circle cx="1180" cy="170" r="170" fill="#FFE08A" opacity="0.30" />
    <circle cx="1180" cy="170" r="100" fill="#FFD25E" opacity="0.50" />
    <circle cx="1180" cy="170" r="62" fill="#FFC93C" />
  </g>

  <g class="gulls">
    <g class="gull">
      @for (g of [0, 1]; track g) {
        <g [attr.class]="'bird b' + g" [attr.transform]="g === 0 ? 'translate(0 0)' : 'translate(-64 24) scale(0.72)'">
          <path class="wing left" d="M0 0 C-7 -9 -19 -12 -31 -7 C-21 -6 -11 -2 0 3 Z" />
          <path class="wing right" d="M0 0 C7 -9 19 -12 31 -7 C21 -6 11 -2 0 3 Z" />
          <ellipse cx="0" cy="2" rx="6.5" ry="2.8" />
          <circle cx="6" cy="0.6" r="2.4" />
        </g>
      }
    </g>
  </g>

  <g class="palm palm-left">
    @for (f of leftPalm; track $index) {
      <path class="stem" [attr.d]="f.stem" />
      <path class="leaf" [attr.d]="f.leaves" />
    }
  </g>

  <g class="palm palm-right">
    @for (f of rightPalm; track $index) {
      <path class="stem" [attr.d]="f.stem" />
      <path class="leaf" [attr.d]="f.leaves" />
    }
  </g>
</svg>
