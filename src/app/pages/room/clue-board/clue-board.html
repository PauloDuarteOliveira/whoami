<section class="card board" aria-label="Clue board">
  <div class="board-head">
    <h2>Clue board</h2>
    <div class="filters" role="group" aria-label="Filter the answers">
      @for (f of filters; track f.value) {
        <button type="button" class="filter" [class.active]="filter() === f.value" (click)="filter.set(f.value)">{{ f.label }}</button>
      }
    </div>
  </div>

  <div class="cards">
    @for (p of ordered(); track p.id) {
      <app-clue-card
        [player]="p"
        [groups]="groupsOf(p)"
        [status]="statusOf(p)"
        [isMe]="p.id === me.id"
        [isCurrent]="p.id === room.current_player_id"
        [dimmed]="p.status !== 'playing' || !isOnline(p)"
        [filter]="filter()" />
    }
  </div>
</section>
