<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>WhoAmI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guess who you are. A party game to play with friends.">
  <meta name="theme-color" content="#0A3440">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Bigger icons for phones (share sheet, home screen) and the card shown when an invite link is shared. -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WhoAmI">
  <meta property="og:title" content="WhoAmI">
  <meta property="og:description" content="Guess who you are. Play with friends.">
  <meta property="og:image" content="https://pauloduarteoliveira.github.io/whoami/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Day or Night before the app starts, so the page doesn't flash the wrong sky.
       Your saved choice wins; a first visit follows the device's light or dark mode (same rule as PreferencesService). -->
  <script>
    try {
      var sky = localStorage.getItem('whoami.sky');
      if (sky !== 'day' && sky !== 'night') sky = matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      document.documentElement.dataset.sky = sky;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Shown while the app starts and signs the player in; Angular replaces it with the app. -->
  <app-root>
    <p style="font-family: Fredoka, system-ui, sans-serif; color: var(--muted); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;">Connecting to the game…</p>
  </app-root>
</body>

</html>
